name: Release Docker Image

# 触发：推送 v* 标签（如 v4.0.0）自动构建多平台镜像并发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write      # 创建 GitHub Release
  packages: write      # 推送 GHCR

env:
  IMAGE_NAME: free-short-video
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 冒烟测试：本地构建单平台镜像并验证服务可启动 ──
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (start container, probe endpoints)
        run: |
          docker run -d -p 8765:8765 -e AGNES_API_KEY=smoke-test-key --name fsv-smoke ${{ env.IMAGE_NAME }}:smoke
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET / => $code"
          cfg=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/api/config)
          echo "GET /api/config => $cfg"
          docker logs fsv-smoke 2>&1 | tail -20
          docker stop fsv-smoke && docker rm fsv-smoke
          if [ "$code" != "200" ]; then echo "SMOKE TEST FAILED"; exit 1; fi

      # ── 主仓库：GitHub Container Registry（GHCR）──
      # 必须用仓库自带的 GITHUB_TOKEN 推送，包才会关联到本仓库、
      # 出现在仓库 Packages 页并可在仓库内设为 public。
      # 个人 PAT 推仓库级路径不会挂到仓库 UI（表现为 Packages 页为空、链接 404）。
      # 前置条件：仓库/组织 Settings → Actions → General → Workflow permissions
      #           必须设为 "Read and write permissions"，否则 GITHUB_TOKEN 为只读，推送 403。
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 清理历史由个人 PAT 推成的 user-owned 孤儿包：repo 级路径的包若被记为
      # user-owned，GITHUB_TOKEN（repo 上下文）无法写入该路径。先尝试删除，再让
      # GITHUB_TOKEN 以 repo-owned 重建并关联到本仓库。
      - name: Remove orphan GHCR package (if any)
        if: ${{ secrets.GHCR_PAT != '' }}
        continue-on-error: true
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          echo "Removing any orphan free-short-video package before rebuild..."
          curl -sS -o /dev/null -w "user-scoped: %{http_code}\n" -X DELETE \
            -H "Authorization: Bearer $GHCR_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/free-short-video" || true
          curl -sS -o /dev/null -w "repo-scoped: %{http_code}\n" -X DELETE \
            -H "Authorization: Bearer $GHCR_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lcy362/agnes-video-generator/packages/container/free-short-video" || true

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}      # v4.0.0
            type=semver,pattern={{major}}.{{minor}}  # v4.0
            type=raw,value=latest                 # latest

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 同步到 Docker Hub（提升公开曝光）──
      # 在仓库 Settings → Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后生效
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # ── 同步 Docker Hub 仓库描述与完整说明（README）──
      # Docker Hub 不会从 GitHub 自动同步，这里用 Hub API 把仓库 description + README 填进去。
      - name: Update Docker Hub repository overview
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        continue-on-error: true
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO_DESC: ${{ github.event.repository.description }}
        run: python3 .github/scripts/update_dockerhub_overview.py

      # ── Auto-generate GitHub Release notes ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Image

            Multi-arch (`linux/amd64`, `linux/arm64`) images for this release are published to **GHCR** and **Docker Hub**.

            ### Pull

            GitHub Container Registry (GHCR):
            ```bash
            docker pull ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ```

            Docker Hub:
            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ### Run

            > **Data persistence:** the app writes all generated videos, uploads and settings into `/app/.working_dir` and `/app/.agnes_config` *inside the container*. A plain `docker run` without a volume loses everything when the container is recreated. Mount these paths to your host so outputs survive restarts and can be exported.

            **Option A — bind mount to a host folder (recommended; files land directly in the folder):**
            ```bash
            mkdir -p ~/agnes-data/working ~/agnes-data/config
            docker run -d -p 8765:8765 \
              -e AGNES_API_KEY=<your-key> \
              -v ~/agnes-data/working:/app/.working_dir \
              -v ~/agnes-data/config:/app/.agnes_config \
              ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ```
            Your videos will be in `~/agnes-data/working/` on your machine.

            **Option B — named Docker volume (no host path needed; survives container recreation):**
            ```bash
            docker volume create agnes-working
            docker volume create agnes-config
            docker run -d -p 8765:8765 \
              -e AGNES_API_KEY=<your-key> \
              -v agnes-working:/app/.working_dir \
              -v agnes-config:/app/.agnes_config \
              ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ```
            Export files from a named volume:
            ```bash
            docker run --rm -v agnes-working:/data -v "$PWD":/out busybox cp -r /data/. /out/agnes-export
            ```

            Then open **http://localhost:8765**.

            **Notes**
            - Prefer Docker Hub? Replace the image with `${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`.
            - The image already declares `VOLUME` for both paths, so `docker run -p 8765:8765 <image>` (no `-v`) keeps data only while you reuse the same container (`stop`/`start`); recreating the container starts fresh.
            - `AGNES_API_KEY` can also be set later in the Web UI; it is then stored in the mounted config volume.
