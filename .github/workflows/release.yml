name: Release Docker Image

# 触发：推送 v* 标签（如 v4.0.0）自动构建多平台镜像并发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write      # 创建 GitHub Release
  packages: write      # 推送 GHCR

env:
  IMAGE_NAME: free-short-video

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 冒烟测试：本地构建单平台镜像并验证服务可启动 ──
      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (start container, probe endpoints)
        run: |
          docker run -d -p 8765:8765 -e AGNES_API_KEY=smoke-test-key --name fsv-smoke ${{ env.IMAGE_NAME }}:smoke
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET / => $code"
          cfg=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/api/config)
          echo "GET /api/config => $cfg"
          docker logs fsv-smoke 2>&1 | tail -20
          docker stop fsv-smoke && docker rm fsv-smoke
          if [ "$code" != "200" ]; then echo "SMOKE TEST FAILED"; exit 1; fi

      # ── 主仓库：GitHub Container Registry（GHCR）──
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}      # v4.0.0
            type=semver,pattern={{major}}.{{minor}}  # v4.0
            type=raw,value=latest                 # latest

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 同步到 Docker Hub（提升公开曝光）──
      # 在仓库 Settings → Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后生效
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # ── 自动生成 GitHub Release 说明 ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker 镜像
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
            运行：
            ```bash
            docker run -p 8765:8765 -e AGNES_API_KEY=<你的key> ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
